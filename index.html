<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>To-Do List App</title>
  </head>
  <body class="bg-slate-600 flex items-center justify-center h-screen">
    <div class="h-111 w-88 bg-sky-300 p-6 rounded-lg ">
      <h1 class="text-center text-2xl font-medium">To-Do List App <i class="fa-solid fa-list-check"></i></h1>
      <div class="my-6">
        <input
          class="input border-2 border-sky-900 outline-none "
          type="text"
          placeholder="Enter your items"
        />
        <button
          class="bg-slate-800 p-1 w-17 text-white rounded-sm hover:cursor-pointer outline-none"
          onclick="Add()"
        >
          Add
        </button>
      </div>
      <div class="text  "></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
